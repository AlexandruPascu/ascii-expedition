name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure C++11 and strict warnings
        run: >-
          cmake -S "My first Game" -B build
          -DCMAKE_BUILD_TYPE=Release
          -DEA_WARNINGS_AS_ERRORS=ON
          -DEA_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux memory and undefined behavior checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure sanitizers
        run: >-
          cmake -S "My first Game" -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DEA_ENABLE_SANITIZERS=ON
          -DEA_WARNINGS_AS_ERRORS=ON
          -DEA_REQUIRE_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  learning:
    name: CEM and PPO smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Build native simulator
        run: >-
          cmake -S "My first Game" -B build -DCMAKE_BUILD_TYPE=Release
          -DEA_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel 2
      - name: Install CPU learning dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ai/requirements.txt
      - name: Train, reload, and replay both agents
        run: python ai/smoke_test.py
